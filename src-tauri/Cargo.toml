[package]
name = "gists-client"
version = "0.2.0"
description = "A lightweight GitHub Gist desktop client"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
similar = { version = "2", features = ["text"] }
futures = "0.3"
keyring = { version = "2", features = ["linux-default-keyutils"] }
aes-gcm = { version = "0.10", features = ["std"] }
rand = { version = "0.8", features = ["getrandom"] }
dirs = "5"
sentry = { version = "0.36.0", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls"] }
fastembed = { version = "5.15.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

[target.'cfg(debug_assertions)'.dependencies]
tauri-plugin-wdio-webdriver = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
