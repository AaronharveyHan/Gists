[package]
name = "gists-client"
version = "0.2.0"
description = "A lightweight GitHub Gist desktop client"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
  "shell-open",
  "dialog-open",
  "dialog-save",
  "dialog-confirm",
  "global-shortcut-all",
  "system-tray",
  "clipboard-write-text",
  "window-hide",
  "window-show",
  "window-set-focus",
  "window-center",
  "window-start-dragging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
similar = { version = "2", features = ["text"] }
futures = "0.3"
keyring = { version = "2", features = ["linux-default-keyutils"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
