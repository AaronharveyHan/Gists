name: Release

# 触发条件：推送 v* 格式的 tag，例如 v0.2.1
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    strategy:
      fail-fast: false   # 某个平台失败不影响其他平台继续跑
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-22.04   # glibc 2.35：glibc_compat.c 垫片解决 ort-sys 的 __isoc23_strtol* 符号缺失

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v5

      # 2. 安装 Node.js
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 安装 Rust stable
      - uses: dtolnay/rust-toolchain@stable

      # 4. 缓存 Rust 编译产物（加速后续构建）
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 5. Linux 系统依赖（仅在 ubuntu 上执行）
      #    Tauri v2 改用 WebKitGTK 4.1 + libsoup-3（v1 是 4.0 + libsoup2）。
      #    托盘 / 全局快捷键插件额外需要 ayatana-appindicator 与 libxdo。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            build-essential \
            curl \
            wget

      # 6. 安装前端依赖
      - name: Install frontend dependencies
        run: npm ci

      # 7. 编译 gist CLI（独立 workspace crate，产物在根目录 target/release/gist）
      - name: Build gist CLI
        run: cargo build -p gist --release

      # 8. 编译 + 创建 Release + 上传产物
      #    tauri-action 会：
      #    - 运行 npm run build（vite 构建前端）
      #    - 运行 cargo tauri build（编译 Rust + 打包）
      #    - 在 GitHub Releases 创建一个 draft release（同名 tag 只创建一次）
      #    - 把本平台产物上传到该 release
      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名密钥：在 GitHub → Settings → Secrets and variables → Actions 中配置
          # 生成方法：npx @tauri-apps/cli@2 signer generate
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}          # 例：v0.2.1
          releaseName: 'Gists Client ${{ github.ref_name }}'
          releaseBody: |
            ## 安装说明

            ### 桌面应用
            | 平台 | 下载文件 |
            |------|----------|
            | macOS | `.dmg` |
            | Windows | `.msi`（推荐）或 `.exe` |
            | Linux | `.AppImage`（推荐，免安装）或 `.deb` |
            > **macOS 用户**：首次打开时若提示"无法验证开发者"，右键 → 打开 即可。
            > **Windows 用户**：SmartScreen 警告点"仍要运行"即可。
            > **Linux 用户**：`.AppImage` 下载后 `chmod +x` 即可运行；`.deb` 适用于 Debian/Ubuntu。

            ### 命令行工具 `gist`（可选）
            > 提示：`.deb` / `.msi` 桌面安装包已内置 `gist` 命令，安装桌面端后即可直接使用，无需单独下载。
            > 仅需命令行工具、不想装桌面端的用户，可下载下方独立二进制：

            | 平台 | 下载文件 |
            |------|----------|
            | macOS (Apple Silicon) | `gist-macos-arm64` |
            | Windows (x86_64) | `gist-windows-x86_64.exe` |
            | Linux (x86_64) | `gist-linux-x86_64` |
            > macOS / Linux：`chmod +x gist-* && mv gist-* /usr/local/bin/gist`，然后 `gist save foo.py`。与桌面端共享同一数据库。
          releaseDraft: false     # Must be false: draft releases are excluded from
                              # releases/latest/download/ so the Tauri updater would
                              # never find latest.json and auto-update silently fails.
          prerelease: false

      # 9. 重命名为带平台后缀的资产名（避免三平台文件名冲突）
      #    gist 已在第 7 步构建完成，这里直接复用 target/release 下的产物。
      - name: Stage CLI binary (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos-latest) OUT=gist-macos-arm64 ;;
            ubuntu-22.04) OUT=gist-linux-x86_64 ;;
            *)            OUT=gist-unknown ;;
          esac
          cp target/release/gist "$OUT"
          echo "CLI_ASSET=$OUT" >> "$GITHUB_ENV"

      - name: Stage CLI binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item target\release\gist.exe gist-windows-x86_64.exe
          "CLI_ASSET=gist-windows-x86_64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 10. 上传 CLI 到同一个 draft release（tauri-action 已创建好，按 tag 查找）
      - name: Upload gist CLI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.CLI_ASSET }}" --clobber
