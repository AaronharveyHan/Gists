name: E2E Tests

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - main

jobs:
  e2e:
    # ubuntu-24.04 ships webkit2gtk-driver in its default repos;
    # 22.04 does not have that package.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Rust stable
      - uses: dtolnay/rust-toolchain@stable

      # 4. Rust build cache
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 5. Linux system dependencies (WebKitGTK + WebDriver)
      #    webkit2gtk-driver ships WebKitWebDriver (the W3C WebDriver binary for GTK WebKit).
      #    Available in Ubuntu 24.04 repos; ubuntu-24.04 runner is required.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            xvfb \
            build-essential

      # 6. Install npm dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 7. Install tauri-driver (the WebDriver server binary)
      - name: Install tauri-driver
        run: cargo install tauri-driver --version "^2"

      # 8. Build the Tauri app in debug mode
      #    Debug builds are faster and include the WDIO plugin.
      - name: Build Tauri app (debug)
        run: cargo build -p gists-client

      # 9. Run E2E tests under a virtual display (required for WebKitGTK on Linux)
      - name: Run E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
        env:
          # Prevent WebKitGTK from trying to connect to a real D-Bus session
          DBUS_SESSION_BUS_ADDRESS: /dev/null

      # 10. Upload Playwright/WDIO reports on failure
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs
          path: |
            logs/
            .wdio-cache/
          retention-days: 7
