name: E2E Tests

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - main

jobs:
  e2e:
    # ubuntu-24.04 ships webkit2gtk-driver in its default repos;
    # 22.04 does not have that package.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Rust stable
      - uses: dtolnay/rust-toolchain@stable

      # 4. Rust build cache
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. Linux system dependencies (WebKitGTK + display + D-Bus)
      #    dbus-x11 provides dbus-run-session, which gives the Tauri app a real
      #    D-Bus session so WebKitGTK's sub-processes can communicate via IPC.
      #    Without a real D-Bus session the network/web processes fail silently
      #    and the webview renders a blank page.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            xvfb \
            dbus-x11 \
            build-essential

      # 6. Install npm dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 7. Build the frontend (produces dist/ needed by vite preview below)
      - name: Build frontend
        run: npm run build

      # 8. Build the Tauri app in debug mode
      #    The debug binary uses devUrl=http://localhost:1420 (from tauri.conf.json).
      #    We serve that URL with "vite preview" in the next step instead of embedding
      #    the frontend via --features custom-protocol, because tauri:// pages block
      #    WebKitWebDriver JavaScript execution (all commands hang forever).
      - name: Build Tauri app (debug)
        run: cargo build -p gists-client
        env:
          CARGO_TARGET_DIR: src-tauri/target

      # 9. Run E2E tests under a virtual display with a real D-Bus session.
      #    Each spec file is run as a separate wdio invocation so that every spec
      #    gets its own fresh Tauri process and embedded WebDriver session.
      #    Running all specs in one session causes the embedded WebDriver server
      #    to become unreliable after 3-4 sessions.
      #    Each separate wdio.conf.ts load creates a new e2eTmpDir, giving every
      #    spec a fully isolated SQLite DB and XDG data directory.
      - name: Run E2E tests
        run: |
          npx vite preview --port 1420 &
          VITE_PID=$!
          # Wait up to 30 s for the preview server to accept connections
          timeout 30 bash -c 'until curl -sf http://localhost:1420 > /dev/null; do sleep 1; done'

          EXIT=0
          PASSED=()
          FAILED=()
          for spec in $(find e2e -name '*.spec.ts' | sort); do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ RUNNING: $spec"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              dbus-run-session -- npx wdio run wdio.conf.ts --spec "$spec"; then
              PASSED+=("$spec")
              echo "✓ PASSED: $spec"
            else
              EXIT=1
              FAILED+=("$spec")
              echo "✗ FAILED: $spec"
            fi
            # Kill any lingering Tauri process so port 4445 is free for the next spec
            pkill -f 'target/debug/gists-client' 2>/dev/null || true
            sleep 1
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "E2E SUMMARY: ${#PASSED[@]} passed, ${#FAILED[@]} failed"
          for s in "${PASSED[@]}"; do echo "  ✓ $s"; done
          for s in "${FAILED[@]}"; do echo "  ✗ $s"; done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          kill "$VITE_PID" 2>/dev/null || true
          exit $EXIT

      # 10. Upload Playwright/WDIO reports on failure
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs
          path: |
            logs/
            .wdio-cache/
          retention-days: 7
